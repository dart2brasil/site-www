name: build

on:
  # Run on PRs and pushes to the default branch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run build check every day at 3 AM PST.
    - cron: "0 11 * * 0"

# Declare default permissions as read only.
permissions:
  contents: read

env:
  # Configure analytics reporting for pub.
  PUB_ENVIRONMENT: bot.github

jobs:
  build:
    name: Build site and check links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart packages
        run: dart pub get
      - name: Install firebase-tools
        # Pinned because the hosting emulator fails to start with
        # firebase-tools 15.31.0 (ERR_REQUIRE_ESM from stream-chain).
        # Unpin once https://github.com/firebase/firebase-tools/issues/11168
        # is fixed in a release.
        env:
          FIREBASE_TOOLS_VERSION: 15.30.2
        run: |
          sudo curl -sSfLo /usr/local/bin/firebase \
            "https://firebase.tools/bin/linux/v${FIREBASE_TOOLS_VERSION}"
          sudo chmod +rx /usr/local/bin/firebase
          firebase --version
      - name: Build site
        # Só o push na main vira produção: com --release o robots.txt libera
        # os buscadores. Nos previews de PR ele continua bloqueando tudo.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            dart run dash_site build --release
          else
            dart run dash_site build
          fi
      - name: Check for broken Markdown links
        run: dart run dash_site check-link-references
      - name: Check internal site links are functional
        run: dart run dash_site check-links
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: _site

  firebase-deploy-preview:
    name: Deploy Preview to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: _site

      - name: Deploy Preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSLITERADU }}'
          channelId: pr-${{ github.event.number }}
          projectId: transliteradu

  firebase-deploy-production:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: _site

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSLITERADU }}'
          projectId: transliteradu
          channelId: live
