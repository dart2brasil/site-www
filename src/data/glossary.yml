- term: "Reified generics"
  short_description: |-
    A preservação dos argumentos de tipo genéricos em tempo de execução,
    permitindo verificações de tipo contra o tipo genérico completo,
    como com `is List<String>`.
  long_description: |-
    No Dart, os argumentos de tipo genéricos são _reified_ (reificados),
    o que significa que eles mantêm o controle dos seus argumentos de tipo em tempo de execução.
    Isso permite inspecionar e verificar o tipo genérico completo de um objeto,
    e não apenas o seu tipo bruto, sem argumentos de tipo.

    Por exemplo, você pode verificar se uma lista é
    especificamente um [subtipo](#subtype) de `List<String>`:

    ```dart
    final names = ['Dart', 'Flutter', 'Jaspr'];
    print(names is List<String>); // Prints: true
    print(names is List<int>);    // Prints: false
    ```

    Os genéricos reificados também habilitam as verificações de tipo em tempo de execução do Dart
    para tipos genéricos [covariantes](#variance).
    Para garantir a [solidez](#sound), quando você adiciona um elemento a uma lista,
    o Dart valida em tempo de execução que o elemento corresponde
    ao argumento de tipo real da lista.
    Por exemplo, se você tentar adicionar um `double` a uma `List<int>`,
    como `double` não é subtipo de `int`,
    o Dart lança um erro em tempo de execução:

    ```dart
    List<num> numbers = <int>[1, 2, 3]; // Explicitly typed as `List<num>`.
    numbers.add(1.5); // Throws a TypeError because `1.5` isn't an int.
    ```

    Isso contrasta com algumas outras linguagens, como Java,
    em que os argumentos de tipo são removidos antes da execução, por meio de
    _type erasure_ (apagamento de tipo).
    Assim, nessas linguagens, você pode testar se um objeto é uma `List`,
    mas não se é uma `List<String>`.
  related_links:
    - text: "Generics"
      link: "/language/generics"
      type: "doc"
    - text: "Variance"
      link: "#variance"
      type: "term"
    - text: "Programação genérica na Wikipedia"
      link: "https://en.wikipedia.org/wiki/Generic_programming"
      type: "external"
  labels:
    - "language"
    - "type system"
    - "generics"
  alternate:
    - "Reification"
    - "Reified"

- term: "Scope"
  short_description: |-
    A região de um programa em que um nome (como uma variável, função ou classe)
    é visível e pode ser referenciado.
  long_description: |-
    **Scope** (escopo) define onde os identificadores, como variáveis, parâmetros, funções
    e classes, são acessíveis dentro de um programa.

    O Dart usa **escopo léxico (estático)**, o que significa que o escopo de um nome é
    determinado pela estrutura do código-fonte, e não pela forma como o programa
    é executado em tempo de execução. Veja
    [escopo léxico](/language/functions#lexical-scope) para mais detalhes.

    Tipos comuns de escopo no Dart incluem:

    - **Escopo de classe**: membros acessíveis dentro de uma classe.
    - **Escopo de bloco**: variáveis declaradas dentro de blocos como `if`, `for`
      ou `while`.
    - **Escopo de função**: parâmetros e variáveis locais dentro de uma função.
    - **Escopo de biblioteca**: declarações de nível superior visíveis dentro de uma biblioteca.

  related_links:
    - text: "Variáveis"
      link: "/language/variables"
      type: "doc"
    - text: "Funções e closures"
      link: "/language/functions"
      type: "doc"
  labels:
    - "language"
  alternate:
    - "Lexical scope"

- term: "Sound"
  short_description: |-
    Uma garantia do sistema de tipos de que o valor em tempo de execução de uma expressão
    sempre corresponde ao seu tipo estático.
  long_description: |-
    Um sistema de tipos é _sound_ (sólido) quando garante que um programa
    nunca pode chegar a um estado em que uma expressão é avaliada como um valor
    que não corresponde ao tipo estático da expressão.
    Por exemplo, se o tipo estático de uma expressão é `String`,
    o valor em tempo de execução é garantido como sendo uma `String` quando avaliado.

    O sistema de tipos do Dart é sólido.
    Ele impõe essa garantia por meio de uma combinação de
    verificação estática (erros de compilação) e verificações em tempo de execução:

    - **Verificações estáticas** pegam a maioria dos erros de tipo em tempo de compilação,
      como atribuir uma `String` a uma variável de tipo `int`.
    - **Verificações em tempo de execução** tratam os casos que o compilador não consegue
      verificar estaticamente, como casts com `as` e argumentos de tipo genéricos covariantes.

    A solidez traz vários benefícios práticos:

    - **Bugs relacionados a tipos aparecem em tempo de compilação.**
      Um sistema de tipos sólido obriga o código a ser inequívoco sobre os seus tipos,
      então bugs de tipo que seriam difíceis de
      encontrar em tempo de execução são pegos cedo.
    - **Código mais legível.**
      Você pode confiar que um valor realmente tem o tipo declarado.
      No Dart sólido, os tipos não mentem.
    - **Código mais fácil de manter.**
      Quando você muda um trecho de código,
      o sistema de tipos sólido permite que as ferramentas do Dart
      avisem sobre outros trechos de código que quebraram.
    - **Melhor compilação [ahead-of-time (AOT)](#aot).**
      Tipos sólidos ajudam o compilador a gerar
      código nativo menor e mais eficiente.

    Solidez não significa que o Dart pega _todos_ os bugs.
    Você ainda pode escrever código com erros de lógica, erros de off-by-one
    e outros problemas que o sistema de tipos não trata.
    Significa apenas que os próprios tipos são sempre confiáveis.
  related_links:
    - text: "O sistema de tipos do Dart"
      link: "/language/type-system"
      type: "doc"
    - text: "Null safety"
      link: "/null-safety"
      type: "doc"
    - text: "Type safety na Wikipedia"
      link: "https://en.wikipedia.org/wiki/Type_safety"
      type: "external"
  labels:
    - "language"
    - "type system"
  alternate:
    - "Soundness"
    - "Sound type system"
    - "Type safety"

- term: "Subclass"
  short_description: |-
    Uma classe que herda a implementação de outra classe.
  long_description: |-
    Uma _subclass_ (subclasse) é uma classe que herda a implementação de outra classe ao
    usar a keyword [`extends`][], ou por [mixin application][].

    ```dart
    // A is a subclass of B; B is the superclass of A.
    class A extends B {}

    // B1 has the superclass `A with M`, which has the superclass A.
    class B1 extends A with M {}
    ```

    A relação de subclasse também implica uma relação de [subtipo](#subtype) associada.
    Por exemplo, `class A` define implicitamente um tipo associado `A`
    que as instâncias da classe `A` ocupam.
    Assim, `class A extends B` declara não apenas que a classe
    `A` é subclasse de `B`, mas também estabelece que o *tipo* `A` é um
    *subtipo* do tipo `B`.

    As relações de subclasse são um subconjunto das relações de subtipo.
    Quando a documentação diz "`S` deve ser um subtipo de `T`",
    é aceitável que `S` seja uma subclasse de `T`.
    No entanto, o inverso não é verdadeiro: nem todo subtipo é uma subclasse.

    [`extends`]: /language/extend
    [mixin application]: #mixin-application
  related_links:
    - text: "Herança em Dart"
      link: "/language/extend"
      type: "doc"
    - text: "Relação de subtipo"
      link: "#subtype"
      type: "term"
  labels:
    - "language"
    - "type system"
  alternate:
    - "child class"

- term: "Shadowing"
  short_description: |-
    Quando uma declaração local oculta outra com o mesmo nome.
  long_description: |-
    **Shadowing** (sombreamento) ocorre quando uma declaração local,
    como uma variável ou parâmetro,
    usa o mesmo nome de uma declaração existente em um escopo externo,
    tornando a externa inacessível dentro do escopo interno.

    Embora seja válido em Dart, o shadowing pode levar a
    código confuso ou a comportamentos não intencionais.
    Por isso, geralmente é desencorajado, a menos que seja
    usado deliberadamente para melhorar a clareza do código.

    ### Exemplo

    Neste exemplo, a variável local `message` dentro
    da função `printMessage` **sombreia** a variável `message` de nível superior:

    ```dart
    final message = 'Global';

    void printMessage() {
      final message = 'Local'; // Shadows the global `message` variable.
      print(message); // Prints: Local
    }

    void main() {
      printMessage();
      print(message); // Prints: Global
    }
    ```

    O shadowing também pode ocorrer em blocos aninhados:

    ```dart
    void main() {
      final value = 10;
      if (true) {
        final value = 20; // Shadows the outer `value` variable.
        print(value);   // Prints: 20
      }
      print(value);     // Prints: 10
    }
    ```
  labels:
    - "language"
  alternate:
    - "variable shadowing"
    - "name shadowing"

- term: "Subtype"
  short_description: |-
    Um tipo que pode ser usado em qualquer lugar em que se espera um valor do seu supertipo.
  long_description: |-
    A relação de _subtype_ (subtipo) existe quando um valor de determinado tipo pode ser substituído
    onde se espera o valor de outro tipo, o supertipo.
    Por exemplo, se `S` é um subtipo de `T`,
    então você pode substituir um valor do tipo `S`
    onde se espera um valor do tipo `T`.

    Um subtipo oferece todas as operações do seu supertipo
    (e possivelmente algumas operações extras).
    Na prática, isso significa que você pode atribuir o valor de um subtipo
    a qualquer local que espere o supertipo,
    e todos os métodos do supertipo estão disponíveis no subtipo.

    Isso vale pelo menos estaticamente.
    Uma API específica pode não permitir a substituição em tempo de execução,
    dependendo das operações que realiza.

    Algumas relações de subtipo se baseiam na estrutura do tipo,
    como com tipos nullable (por exemplo, `int` é subtipo de `int?`)
    e tipos de função
    (por exemplo, `String Function()` é subtipo de `void Function()`).

    Subtipos também podem ser introduzidos para classes por
    [implementação](/language/classes#implicit-interfaces)
    ou [herança](/language/extend) (direta ou indireta):

    ```dart
    // A is a subtype of B, but NOT a subclass of B.
    class A implements B {}

    // C is a subtype AND a subclass of D.
    class C extends D {}
    ```
  related_links:
    - text: "Subclass"
      link: "#subclass"
      type: "term"
    - text: "Substituindo tipos"
      link: "/language/type-system#substituting-types"
      type: "doc"
  labels:
    - "language"
    - "type system"
  alternate:
    - "subtyping"
    - "subtype polymorphism"

- term: "Super parameter"
  short_description: |-
    Um parâmetro de construtor que passa automaticamente
    um argumento para o construtor da superclasse.
  long_description: |-
    Um **super parameter** (super parâmetro) é um atalho de sintaxe que simplifica a
    passagem de parâmetros de um construtor de subclasse
    para um construtor de superclasse.

    Em vez de declarar manualmente o parâmetro
    e passá-lo na lista de inicialização,
    você pode prefixar o nome do parâmetro com `super.`.

    Por exemplo, em `Hammer({required super.price})`,
    o valor de `price` é passado
    diretamente para o construtor da superclasse.
  related_links:
    - text: "Super parâmetros"
      link: "/language/constructors#super-parameters"
      type: "doc"
  labels:
    - "language"
    - "constructors"
    - "syntax"
  alternate:
    - "Super-initializer parameter"

- term: "Transitive dependency"
  short_description: |-
    Uma dependência que um pacote usa indiretamente, porque
    uma das suas dependências a exige.
  long_description: |-
    Uma _transitive dependency_ (dependência transitiva) é uma [dependência][dependency] que um pacote usa indiretamente,
    porque uma das suas dependências, ou as dependências delas, a exige.

    Se o seu pacote depende de A, que por sua vez depende de B, que depende de C,
    então A é uma [dependência imediata][immediate dependency] e B e C são transitivas.

    [dependency]: #dependency
    [immediate dependency]: #immediate-dependency
  related_links:
    - text: "Dependência imediata"
      link: "#immediate-dependency"
      type: "term"
  labels:
    - "pub"
    - "packages"

- term: "Tree shaking"
  short_description: |-
    Uma otimização do compilador que remove código não utilizado.
  long_description: |-
    **Tree shaking** (sacudida de árvore) é uma otimização do compilador que
    analisa quais partes do código são realmente usadas por uma aplicação e
    remove todo o resto da saída final.

    Isso torna o programa compilado menor e mais rápido de carregar, já que código morto
    que nunca é referenciado não acaba no binário ou no bundle.

    O tree shaking é especialmente importante para apps web e mobile, em que
    o tamanho do código impacta diretamente o tempo de download e o desempenho em tempo de execução.

    Por exemplo, se você importar uma biblioteca que define dez funções de nível superior,
    mas seu app chama apenas duas, o tree shaking garante que
    as outras oito funções sejam excluídas da saída compilada.
  related_links:
    - text: "Dart compile"
      link: "/tools/dart-compile"
      type: "doc"
    - text: "Bibliotecas e imports"
      link: "/language/libraries"
      type: "doc"
    - text:  "Deploy para web"
      link:  "/web/deployment"
      type: "doc"
  labels:
    - "language"
    - "compilation"
    - "optimization"
  alternate:
    - "Dead-code elimination"

- term: "Top type"
  short_description: |-
    Um tipo que é supertipo de todos os outros tipos,
    incluindo `Object?`.
  long_description: |-
    Um **top type** (tipo superior) é qualquer tipo que seja supertipo de `Object?`.
    Como `Object?` é ele mesmo supertipo de todos os outros tipos do Dart,
    um top type fica no topo da hierarquia de tipos,
    então você pode atribuir qualquer valor a uma variável com top type.

    O Dart tem vários top types,
    mas os principais são os três seguintes:

    - **`Object?`** -
      O supertipo nullable de todos os tipos.
      Todo valor em Dart, incluindo `null`, é um `Object?`.

    - **`dynamic`** -
      Um tipo especial que desativa a verificação estática de tipos.
      Assim como `Object?`, aceita qualquer valor,
      mas também permite acessar _qualquer_ membro
      dele sem um erro de compilação.
      A verificação é adiada para o tempo de execução.

    - **`void`** -
      Um tipo que indica que o valor não deve ser usado.
      Você pode atribuir qualquer valor a `void`,
      mas não pode usar o resultado sem um cast.

    Além desses três principais, há outros top types compostos.
    `FutureOr<T>` é um top type sempre que `T` é um top type,
    e adicionar `?` a certos tipos também produz um top type.
    Por exemplo, `FutureOr<Object?>`, `FutureOr<Object>?`
    e `dynamic?` são todos top types.

    Em contraste com `Object?`, o tipo `Object` non-nullable é
    o supertipo de todos os tipos _non-nullable_, mas não é um top type verdadeiro
    porque não é supertipo de `Null`.

    O top type é o inverso do [bottom type](#bottom-type).
    Enquanto um top type é supertipo de tudo,
    o bottom type (`Never` no Dart) é subtipo de tudo.

    ```dart
    Object? a = 42;        // OK: int is a subtype of Object?.
    Object? b = 'hello';   // OK: String is a subtype of Object?.
    Object? c = null;      // OK: Null is a subtype of Object?.
    dynamic d = [1, 2, 3]; // OK: List<int> is a subtype of dynamic.
    void e = true;         // OK: bool is a subtype of void.
    ```
  related_links:
    - text: "O sistema de tipos do Dart"
      link: "/language/type-system"
      type: "doc"
    - text: "Bottom type"
      link: "#bottom-type"
      type: "term"
    - text: "Top e bottom types no Dart"
      link: "/null-safety/understanding-null-safety#top-and-bottom"
      type: "doc"
    - text: "Caracterização sintática de top types no Dart"
