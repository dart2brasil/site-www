- term: "Definite assignment"
  short_description: |-
    A determinação de se uma variável recebeu com certeza um valor
    antes de ser usada.
  long_description: |-
    A análise de definite assignment (atribuição definitiva) é o processo de determinar, para cada
    variável local em cada ponto do código, qual das seguintes situações é verdadeira:

    - A variável recebeu com certeza um valor
      (_definitely assigned_).
    - A variável com certeza não recebeu um valor
      (_definitely unassigned_).
    - A variável pode ou não ter recebido um valor,
      dependendo do caminho de execução percorrido até aquele ponto.

    A análise de definite assignment ajuda a encontrar problemas no código,
    como lugares onde uma variável que pode não ter recebido um valor é referenciada, ou
    lugares onde uma variável que só pode receber um valor uma vez é
    atribuída depois de talvez já ter recebido um valor.

    Por exemplo, no código a seguir a variável `s` é
    definitely unassigned quando é passada como argumento para `print`:

    ```dart
    void f() {
      String s;
      print(s);
    }
    ```

    Mas no código a seguir, a variável `s` é definitely assigned:

    ```dart
    void f(String name) {
      String s = 'Hello $name!';
      print(s);
    }
    ```

    A análise de definite assignment consegue até dizer se
    uma variável é definitely assigned (ou unassigned) quando
    há vários caminhos de execução possíveis.
    No código a seguir, a função `print` é chamada se a
    execução passar pelo ramo true ou pelo ramo false da
    instrução `if`, mas como `s` recebe um valor independentemente de qual ramo for seguido,
    ela é definitely assigned antes de ser passada para `print`:

    ```dart
    void f(String name, bool casual) {
      String s;
      if (casual) {
        s = 'Hi $name!';
      } else {
        s = 'Hello $name!';
      }
      print(s);
    }
    ```

    Na análise de fluxo, o fim da instrução `if` é chamado de
    _join_ (junção): um lugar onde dois ou mais caminhos de execução se reúnem novamente.
    Onde há uma junção, a análise diz que
    uma variável é definitely assigned se ela for definitely assigned em
    todos os caminhos que se juntam, e definitely unassigned se
    for definitely unassigned em todos os caminhos.

    Às vezes uma variável recebe um valor em um caminho, mas não em outro,
    caso em que a variável pode ou não ter recebido um valor.
    No exemplo a seguir, o ramo true da instrução `if` pode ou não
    ser executado, então a variável pode ou não ter recebido um valor:

    ```dart
    void f(String name, bool casual) {
      String s;
      if (casual) {
        s = 'Hi $name!';
      }
      print(s);
    }
    ```

    O mesmo vale se houver um ramo false que
    não atribui um valor a `s`.

    A análise de loops é um pouco mais complicada,
    mas segue o mesmo raciocínio básico.
    Por exemplo, a condição de um loop `while` é sempre executada,
    mas o corpo pode ou não ser. Assim como em uma instrução `if`,
    há uma junção no fim da instrução `while` entre
    o caminho em que a condição é `true` e
    o caminho em que a condição é `false`.
  related_links:
    - text: "Especificação de definite assignment"
      link: "https://github.com/dart-lang/language/blob/main/resources/type-system/flow-analysis.md"
      type: "doc"
    - text: "Entendendo a análise de definite assignment"
      link: "/null-safety/understanding-null-safety#definite-assignment-analysis"
      type: "doc"
  labels:
    - "language"
