- term: "Override inference"
  short_description: |-
    Como os tipos ausentes em uma declaração de método são inferidos.
  long_description: |-
    Override inference (inferência por sobrescrita) é o processo pelo qual quaisquer tipos ausentes em
    uma declaração de método são inferidos com base nos tipos correspondentes do método, ou métodos,
    que ele sobrescreve.

    Se um método candidato (o método que está sem informação de tipo)
    sobrescreve um único método herdado, então os
    tipos correspondentes do método sobrescrito são inferidos.
    Por exemplo, considere o seguinte código:

    ```dart
    class A {
      int m(String s) => 0;
    }

    class B extends A {
      @override
      m(s) => 1;
    }
    ```

    A declaração de `m` em `B` é um candidato porque
    está sem o tipo de retorno e sem o tipo do parâmetro.
    Como ela sobrescreve um único método (o método `m` de `A`),
    os tipos do método sobrescrito serão usados para inferir
    os tipos ausentes, e será como se o método em `B` tivesse sido
    declarado como `int m(String s) => 1;`.

    Se um método candidato sobrescreve vários métodos, e
    o tipo de função de um desses métodos sobrescritos, M<sub>s</sub>,
    é um supertipo dos tipos de função de todos os outros métodos sobrescritos,
    então M<sub>s</sub> é usado para inferir os tipos ausentes.
    Por exemplo, considere o seguinte código:

    ```dart
    class A {
      int m(num n) => 0;
    }

    class B {
      num m(int i) => 0;
    }

    class C implements A, B {
      @override
      m(n) => 1;
    }
    ```

    A declaração de `m` em `C` é um candidato à override inference porque
    está sem o tipo de retorno e sem o tipo do parâmetro.
    Ela sobrescreve tanto `m` em `A` quanto `m` em `B`, então o compilador precisa
    escolher um deles para inferir os tipos ausentes.
    Mas como o tipo de função de `m` em `A` (`int Function(num)`) é
    um supertipo do tipo de função de `m` em `B` (`num Function(int)`),
    a função de `A` é usada para inferir os tipos ausentes. O resultado é
    o mesmo que declarar o método em `C` como `int m(num n) => 1;`.

    É um erro se nenhum dos métodos sobrescritos tiver um tipo de função que
    seja supertipo de todos os outros métodos sobrescritos.
  related_links:
    - text: "Herança em Dart"
      link: "/language/extend"
      type: "doc"
  labels:
    - "language"
    - "type inference"
    - "understanding diagnostics"

- term: "Package"
  short_description: |-
    Um diretório com uma coleção de bibliotecas Dart, recursos
    e um arquivo pubspec.yaml que os descreve.
  long_description: |-
    Um _package_ (pacote) Dart é uma coleção de [bibliotecas][libraries] Dart e recursos em
    um diretório, com um arquivo [`pubspec.yaml`][] na raiz desse diretório.

    Pacotes podem ter [dependências][dependencies] em outros pacotes
    *e* podem ser dependências em si.
    O diretório `/lib` de um pacote contém as [bibliotecas públicas][public libraries] que
    outros pacotes podem importar e usar.
    Eles também podem incluir scripts para serem executados diretamente.
    Um pacote que não se destina a ser usado como dependência por
    outros pacotes é um [application package][].
    Pacotes compartilhados são [publicados][published] no pub.dev,
    mas você também pode ter pacotes não publicados.

    Não inclua o [lockfile][] de um pacote no controle de versão,
    já que bibliotecas devem suportar um intervalo de versões de dependências.
    As [version constraints][] das [dependências imediatas][immediate dependencies] de um pacote devem
    ser o mais amplas possível, mantendo ao mesmo tempo a garantia de que as dependências serão
    compatíveis com as versões com as quais foram testadas.

    Como o [semantic versioning][] exige que
    bibliotecas incrementem o número da versão major para
    qualquer mudança incompatível com versões anteriores, pacotes normalmente
    exigem que as versões das dependências sejam maiores ou iguais às
    versões testadas e menores que a próxima versão major.
    Então, se sua biblioteca dependesse do pacote (fictício) `transmogrify` e
    você a tivesse testado na versão `1.2.1`, sua version constraint seria `^1.2.1`.

    [libraries]: #library
    [`pubspec.yaml`]: /tools/pub/pubspec
    [dependencies]: #dependency
    [public libraries]: /tools/pub/package-layout#public-libraries
    [application package]: #application-package
    [published]: /tools/pub/publishing
    [lockfile]: #lockfile
    [version constraints]: #version-constraint
    [immediate dependencies]: #immediate-dependency
    [semantic versioning]: https://semver.org/spec/v2.0.0-rc.1.html
  related_links:
