- term: "Immutable"
  short_description: |-
    Um objeto cujo estado, incluindo todos os valores aninhados, não pode ser alterado após ser criado.
  long_description: |-
    Um objeto imutável é aquele cujo estado não pode ser modificado depois de criado.
    Quando um objeto é imutável, todos os seus campos devem ser `final` (não podem ser reatribuídos), e
    os valores desses campos devem, por sua vez, ser imutáveis (não podem ser mutados).
    Isso ajuda a garantir consistência e permite um uso mais seguro em código concorrente ou reativo.

    No Dart, uma classe é imutável se você:

    * Declarar todos os campos como final, para que não possam ser reatribuídos.
    * Garantir que os próprios valores dos campos sejam imutáveis.
    * Opcionalmente, usar a annotation `@immutable` do pacote meta.
      Isso permite que o analyzer avise você se algum campo não for final ou referenciar um tipo mutável.

    Além disso, todos os valores const do Dart são imutáveis. Por exemplo, `const [1, 2, 3]`
    cria uma lista imutável. Se uma classe tem um construtor `const` (que não seja factory), então
    todos os seus campos devem ser final.

    Exemplo:

      ```dart
      import 'package:meta/meta.dart';

      @immutable
      class User {
        final String name;
        final int age;

        const User(this.name, this.age);
      }
      ```

    No exemplo acima, depois de criado, você não pode modificar a instância de `User`.
    Você precisa criar uma nova para alterar qualquer dado.

  related_links:
    - text: "final"
      link: "/language/class-modifiers#final"
      type: "term"
  labels:
