- term: "Wildcard"
  id: "wildcard"
  short_description: |-
    Um símbolo (`_`) usado no lugar de um nome de variável para
    indicar um valor não utilizado em padrões e outros contextos.
  long_description: |-
    Um wildcard (curinga) é o caractere de underscore (`_`) usado para
    ignorar valores ou indicar que um valor é intencionalmente não utilizado.
    Ele é frequentemente usado em padrões, desestruturação e expressões switch para
    casar com qualquer valor sem vinculá-lo a um nome.

    Wildcards ajudam a tornar o código mais intencional, deixando claro
    quais valores não são necessários em um contexto específico.

    Exemplo:

    ```dart
    // Ignoring the value in a for-each loop.
    var names = ['Alice', 'Bob', 'Charlie'];
    for (var _ in names) {
      print('Someone is here!');
    }
    ```

    O padrão wildcard é especialmente útil quando:

    - Você só precisa de certas partes de um valor desestruturado.
    - Você quer mostrar explicitamente que alguns valores estão sendo ignorados.
    - Você precisa de um caso genérico no pattern matching.
  related_links:
    - text: "Variáveis wildcard"
      link: "/language/variables#wildcard-variables"
      type: "doc"
    - text: "Padrões wildcard"
      link: "/language/pattern-types#wildcard"
      type: "doc"
  labels:
    - "language"
    - "patterns"
    - "syntax"
  alternate:
    - "Underscore"
    - "Discard symbol"
    - "Pattern wildcard"
    - "Placeholder pattern"

- term: "Zone"
  id: "zone"
  short_description: |-
    Um mecanismo para personalizar o comportamento de código assíncrono
    sem modificar o próprio código assíncrono.
  long_description: |-
    Uma zone (zona) é um contexto de execução que permite rodar código com
    comportamento personalizado para eventos assíncronos, como timers,
    microtasks e erros não capturados.

    Zones são úteis para:
    - Logging
    - Rastreamento de erros
    - Manter estado específico de requisição entre lacunas assíncronas
      (por exemplo, em apps de servidor)
    - Testar e depurar comportamento assíncrono

    Zones oferecem uma forma de rastrear e influenciar a execução assíncrona
    sem exigir que o código assíncrono tenha consciência disso.

    Você pode criar uma nova zone usando `runZoned` (ou `runZonedGuarded`)
    e sobrescrever comportamentos específicos da zone, como tratamento de erros e timers.
    Até mesmo o `print` pode ser sobrescrito, embora ele não seja assíncrono e esteja
    incluído apenas por conveniência.

    Exemplo:
    ```dart
    import 'dart:async';

    void main() {
      runZonedGuarded(() {
        Future.delayed(Duration(seconds: 1), () {
          throw 'Zone caught this error!';
        });
      }, (error, stackTrace) {
        print('Caught error: $error');
      });
    }
    ```

    No exemplo anterior, o erro não capturado dentro do callback assíncrono
    é interceptado pela zone personalizada.

  related_links:
    - text: "Documentação da API de Zones"
      link: "https://api.dart.dev/stable/dart-async/Zone-class.html"
      type: "api"
    - text: "Tratamento de erros com zones"
      link: "https://dart.dev/articles/libraries/zones"
      type: "doc"
    - text: "runZonedGuarded"
      link: "https://api.dart.dev/stable/dart-async/runZonedGuarded.html"
      type: "api"
  labels:
