- term: "Dependency"
  short_description: |-
    Um pacote Dart do qual um pacote depende.
  long_description: |-
    Uma dependência é qualquer outro [pacote][package] Dart do qual um pacote depende.
    Se o seu pacote quer importar código de algum outro pacote,
    esse pacote precisa primeiro ser uma dependência sua.
    As dependências são especificadas no arquivo [pubspec][] do seu pacote
    com a sintaxe descrita em [Dependências de pacotes][Package dependencies].

    Para ver as dependências usadas por um pacote, use [`pub deps`][].

