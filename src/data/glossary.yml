- term: "AOT"
  short_description: |-
    A compilação Ahead-of-Time (AOT) gera binários nativos otimizados em tempo de build.
  long_description: |-
    A compilação Ahead-of-Time (AOT) converte código Dart em código de máquina nativo em
    tempo de build. Isso resulta em executáveis menores e mais rápidos, que iniciam
    instantaneamente e têm desempenho consistente. Builds AOT passam por tree shaking para
    remover código não utilizado e são usados para publicar apps em produção.
  related_links:
    - text: "Dart: As plataformas"
      link: "/overview#platform"
      type: "doc"
    - text: "AOT"
      link: "https://en.wikipedia.org/wiki/Ahead-of-time_compilation"
      type: "external"
  labels:
    - "compilation"
    - "deployment"

- term: "Application package"
  short_description: |-
    Um pacote Dart que contém uma aplicação executável.
  long_description: |-
    Um _application package_ (pacote de aplicação) é um pacote Dart que
    contém um programa ou aplicativo com um [main entrypoint](#entrypoint).
    Destinado a ser executado diretamente, seja na linha de comando, em um navegador,
    ou por outro embedder, como o fornecido pelo Flutter.

    Pacotes de aplicação podem ter [dependencies][] em outros [packages][],
    mas nunca são dependências de outros pacotes.
    Diferente de pacotes regulares, eles não são destinados a serem compartilhados.

    Pacotes de aplicação devem incluir seus [lockfiles][] no controle de versão,
    para que todos trabalhando na aplicação e todos os locais onde a
    aplicação é implantada tenham um conjunto consistente de dependências.

    [main entrypoint]: #entrypoint
    [dependencies]: #dependency
    [packages]: #package
    [lockfiles]: #lockfile
    [version constraints]: #version-constraint
  related_links:
    - text: "Layout de pacotes"
      link: "/tools/pub/package-layout"
      type: "doc"
    - text: "Filosofia de versionamento do Pub"
      link: "/tools/pub/versioning"
      type: "doc"
  labels:
    - "pub"
    - "packages"

- term: "Assist"
  short_description: |-
    Uma edição de código automatizada e local direcionada a fazer melhorias comuns no código.
  long_description: |-
    Um assist é uma edição de código automatizada e local direcionada a fazer melhorias
    comuns no código.
    Exemplos de assists incluem converter declarações `switch` em expressões `switch`,
    inverter os blocos `then` e `else` em uma declaração `if`,
    e inserir widgets em uma estrutura de widgets.
  related_links:
    - text: "Refactor"
      link: "#refactor"
      type: "term"
  labels:
    - "tools"
    - "analyzer"
  alternate:
    - "Quick assist"

- term: "Asynchronous"
  short_description: |-
    Paradigma de programação em Dart em que operações como
    I/O ou chamadas de rede são concluídas depois, sem bloquear o event loop.
  long_description: |-
    Dart usa um modelo de event loop de thread única para programação assíncrona,
    permitindo a execução não bloqueante de tarefas demoradas, como
    I/O de arquivos, requisições HTTP e timers.
    Diferente do código síncrono, que bloqueia até terminar, operações
    async são enfileiradas como microtasks/eventos, mantendo as UIs responsivas.

    Os principais componentes são:

    - **Futures**:
      Representam um valor disponível depois, criados por APIs como `http.get()`.
    - **async/await**:
      Keywords do Dart para escrever código assíncrono legível e fácil de manter.
    - **Streams**:
      Tratam sequências de eventos assíncronos, como dados vindos de web sockets.
    - **Isolates**:
      Permitem paralelismo real por meio de
      contextos de execução independentes com troca de mensagens.
  related_links:
    - text: "Programação assíncrona: futures, async, await"
      link: "/libraries/async/async-await"
      type: "doc"
    - text: "Visão geral da programação assíncrona"
      link: "/language/async"
      type: "doc"
    - text: "Biblioteca dart:async"
      link: "https://api.dart.dev/dart-async"
      type: "api"
    - text: "Referência da classe Future"
