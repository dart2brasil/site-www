- term: "Just-in-Time compilation (JIT)"
  short_description: |-
    Just-in-Time (JIT) é um modo de compilação que compila
    código em tempo de execução para iterações rápidas de desenvolvimento.
  long_description: |-
    A compilação Just-in-Time (JIT) compila código Dart para código de máquina nativo
    enquanto ele roda. Isso habilita recursos como **hot reload** e uma depuração rica,
    ao permitir compilação incremental. O JIT é tipicamente usado
    durante o desenvolvimento, enquanto builds de produção usam AOT.
