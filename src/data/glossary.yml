- term: "Dot shorthand"
  short_description: |-
    Uma forma abreviada de sintaxe que permite omitir o nome do tipo
    ao acessar construtores ou membros estáticos, incluindo valores de enum.
  long_description: |-
    Um **dot shorthand** (atalho com ponto) é um recurso da linguagem que permite um
    código mais conciso, omitindo o nome do tipo ao acessar construtores ou
    membros estáticos, incluindo valores de enum.

    Esse recurso só é permitido quando o tipo esperado da expressão
    pode ser inferido de forma única a partir do contexto ao redor
    (o [context type](#context-type)).

    Por exemplo, em vez de escrever `Status.running`, você pode escrever `.running`
    se o context type já for conhecido como `Status`:

    ```dart highlightLines=8
    enum Status { running, stopped }

    void updateStatus(Status s) {
      print('Status updated to: $s');
    }

    void main() {
      updateStatus(.running); // Resolves to Status.running
    }
    ```
  related_links:
