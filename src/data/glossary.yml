- term: "Verified publisher"
  short_description: |-
    Um publicador de pacotes no site pub.dev cuja
    identidade foi verificada pelo pub.dev.
  long_description: |-
    Um _verified publisher_ (publicador verificado) é um conjunto de um ou mais usuários
    identificados por um nome de domínio único.
    A propriedade do nome de domínio é verificada pelo pub.dev,
