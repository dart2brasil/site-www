- term: "Dependency graph"
  short_description: |-
    Uma representação de como os componentes de um sistema dependem uns dos outros.
  long_description: |-
    Um **dependency graph** (grafo de dependências) é um grafo direcionado que mostra as relações entre
    diferentes componentes de um sistema, como arquivos, módulos, pacotes, funções
    ou assets. Cada nó representa um componente, e cada aresta representa uma
    dependência entre dois componentes.

    No Dart e no Flutter, grafos de dependências são comumente usados por ferramentas como:

    * O compilador, para determinar a ordem de build.
    * O gerenciador de pacotes, para resolver as versões dos pacotes.
    * Sistemas de build, para detectar o que precisa ser recompilado.
    * Tree shaking, para remover código não utilizado.

    Por exemplo, se o arquivo `main.dart` importa `utils.dart`, e `utils.dart` por sua vez
    importa `math.dart`, o grafo de dependências ajuda o compilador a entender a ordem correta
    para processar esses arquivos e quais partes do programa são realmente usadas.

    Grafos de dependências são essenciais para:
    * Builds eficientes
    * Eliminação de código morto (tree shaking)
    * Resolução de dependências
    * Compilação incremental
  related_links:
    - text: "Pacotes Dart (pub.dev)"
      link: "https://pub.dev"
      type: "external"
    - text: "Pub deps"
      link: "/tools/pub/cmd/pub-deps"
