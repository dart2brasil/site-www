- term: "Version constraint"
  short_description: |-
    Uma restrição associada a cada dependência que
    especifica com quais versões um pacote deve funcionar.
  long_description: |-
    Uma _version constraint_ (restrição de versão) é um intervalo especificado de versões compatíveis
    de uma [dependência][dependency] para um pacote.
    Pode ser uma única versão (`0.3.0`) ou um intervalo de versões (`^1.2.1`).
    Embora `any` também seja permitido, por motivos de desempenho não é recomendado.

    [Pacotes de biblioteca][packages] devem sempre especificar version constraints
    para cada uma de suas dependências que não são de desenvolvimento.
    [Application packages][application packages], por outro lado,
    podem aceitar qualquer versão de suas dependências,
    já que usam o [lockfile][lockfile] para gerenciar as versões das dependências.

    [dependency]: #dependency
    [packages]: #package
    [application packages]: #application-package
    [lockfile]: #lockfile
  related_links:
    - text: "Version constraints"
