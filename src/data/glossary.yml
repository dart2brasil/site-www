- term: "Type alias"
  short_description: |-
    Um nome definido pelo usuário para um tipo existente.
  long_description: |-
    Um **type alias** (alias de tipo) é um nome alternativo que se refere a outro tipo.

    Eles podem ser usados para simplificar definições de tipo complexas,
    melhorar a legibilidade ou criar significado semântico no código.

    O Dart permite definir type aliases usando a keyword `typedef`.
    Você pode criar aliases para funções, classes e até tipos genéricos.

    ### Exemplos

    #### Alias de tipo de função

    ```dart
    typedef StringTransformer = String Function(String);

    void printTransformed(String input, StringTransformer transformer) {
      print(transformer(input));
    }

    void main() {
      printTransformed('hello', (str) => str.toUpperCase()); // Output: HELLO
    }
    ```

    #### Alias de classe

    ```dart
    class HttpClient {}

    typedef Client = HttpClient;

    Client client = HttpClient();
    ```

    Type aliases não criam novos tipos, apenas oferecem nomes alternativos.
  related_links:
    - text: "Keyword `typedef`"
      link: "/language/typedefs"
      type: "doc"
  labels:
    - "language"
    - "type system"
  alternate:
    - "typedef"
    - "alias"

- term: "Uninitialized"
  short_description: |-
    Uma variável que foi declarada, mas ainda não recebeu um valor.
  long_description: |-
    Uma variável está _uninitialized_ (não inicializada) quando foi declarada, mas
    ainda não recebeu um valor.

    Variáveis non-nullable precisam ser inicializadas antes de serem lidas,
    seja no momento da declaração, seja em todos os caminhos de execução possíveis
    antes do primeiro uso:

    ```dart
    void f() {
      int x;
      print(x); // Error: variable 'x' must be assigned before it can be used.
    }
    ```

    Variáveis nullable que não são inicializadas explicitamente recebem `null` por padrão:

    ```dart
    int? count; // Implicitly initialized to null.
    print(count); // Prints: null
    ```

    Para adiar a inicialização de uma variável non-nullable,
    use a keyword `late`. Uma variável `late` fica não inicializada
    até a primeira atribuição, e acessá-la antes de ser atribuída
    lança um erro de inicialização late em tempo de execução:

    ```dart
    late String name;
    print(name); // Throws a late initialization error if not yet assigned.
    ```
  related_links:
    - text: "Variáveis"
      link: "/language/variables"
      type: "doc"
    - text: "Definite assignment"
      link: "#definite-assignment"
      type: "term"
    - text: "Late"
      link: "#late"
      type: "term"
  labels:
    - "language"
    - "variables"
    - "null safety"
    - "flow analysis"
  alternate:
    - "Unassigned"
    - "Not initialized"

- term: "Variance and variance positions"
  id: "variance"
  short_description: |-
    Como a mudança de um argumento de tipo afeta a relação
    entre o tipo original e o resultante.

    No Dart, mudar o argumento de tipo de uma
    declaração de tipo (como uma classe) ou o tipo de retorno de uma função muda a
    relação de tipo geral na mesma direção (covariante).

    Já mudar os tipos dos parâmetros de uma função muda a
    relação de tipo geral na direção oposta (contravariante).
  long_description: |-
    Um parâmetro de tipo de uma classe (ou de outra declaração de tipo, como um mixin) é
    dito _covariante_ quando o tipo como um todo
    "covaria" com o argumento de tipo real.
    Em outras palavras, se o argumento de tipo for substituído por um
    subtipo, então o tipo como um todo também é um subtipo.

    Por exemplo, o parâmetro de tipo da classe `List` é covariante porque
    os tipos de lista covariam com o argumento de tipo: `List<int>` é um subtipo de
    `List<Object>` porque `int` é um subtipo de `Object`.

    No Dart, todos os parâmetros de tipo de todas as declarações de class, mixin,
    mixin class e enum são covariantes.

    No entanto, os tipos de função são diferentes:
    um tipo de função é covariante no seu tipo de retorno, mas
    o oposto (conhecido como _contravariante_) nos seus tipos de parâmetro.
    Por exemplo, o tipo `int Function(int)` é um
    subtipo do tipo `Object Function(int)`, mas é um supertipo de `int Function(Object)`.

    Isso faz sentido se você considerar a sua [substituibilidade](#subtype).
    Se você chamar uma função com tipo estático `int Function(int)`,
    essa função pode na verdade ser do tipo `int Function(Object)` em tempo de execução.
    Com base no tipo estático, você espera poder passar um `int` para ela.
    Isso funciona, já que a função na verdade aceita qualquer `Object`,
    e isso inclui todo objeto do tipo `int`.
    Da mesma forma, o resultado retornado será do tipo `int`,
    o que também é o esperado com base no tipo estático.

    Logo, `int Function(Object)` é um subtipo de `int Function(int)`.

    Observe que tudo se inverte para os tipos de parâmetro.
    Em particular, essa relação de subtipo entre tipos de função exige que
    a relação de subtipo _oposta_ exista para o tipo do parâmetro.
    Por exemplo, `void Function(Object)` é um subtipo de `void Function(int)`
    porque `int` é um subtipo de `Object`.

    Com um tipo mais complexo, como `List<void Function(int)>`,
    você precisa considerar as _posições_ no tipo.
    Para isso, transforme uma das partes do tipo em um placeholder,
    e depois considere o que acontece com o tipo quando
    diferentes tipos são colocados nessa posição.

    Por exemplo, considere `List<void Function(_)>` como um modelo para
    um tipo em que você pode colocar diferentes tipos no lugar do placeholder `_`.
    Esse tipo é contravariante na posição em que esse placeholder aparece.

    O exemplo a seguir ilustra isso substituindo `_` por `Object` e por `int`.
    `List<void Function(Object)>` é um subtipo de `List<void Function(int)>`
    porque `void Function(Object)` é um subtipo de `void Function(int)`, já que
    `void` é um subtipo de `void` (os tipos de retorno) e
    `int` é um subtipo de `Object` (os tipos de parâmetro, na ordem inversa).
    Logo, o tipo em `_` varia na direção oposta à do
    tipo `List<void Function(_)>` como um todo, e essa
    "direção oposta" por definição faz dela uma _posição contravariante_.

    Uma _posição covariante_ é definida de forma semelhante.
    Por exemplo, `_` está em posição covariante no tipo `List<_>`,
    e `_` também está em posição covariante no tipo `_ Function(int)`.

    Existe ainda outro tipo de posição, chamada _invariante_,
    mas ela aparece com muito menos frequência, então os detalhes são omitidos aqui.

    Na prática, geralmente basta saber que
    os argumentos de tipo de uma classe, mixin etc. estão em posição covariante,
    assim como o tipo de retorno de um tipo de função, mas
    os tipos dos parâmetros estão em posição contravariante.
  related_links:
    - text: "Relação de subtipo"
      link: "#subtype"
      type: "term"
    - text: "Covariância e contravariância"
      link: "https://en.wikipedia.org/wiki/Covariance_and_contravariance_(computer_science)"
      type: "article"
    - text: "A keyword covariant"
      link: "/language/type-system#covariant-keyword"
      type: "doc"
  labels:
    - "language"
    - "type system"
    - "generics"
  alternate:
    - "variance positions"
    # TODO: Covariant and contravariant could/should have their own entries.
    - "covariance"
    - "covariant"
    - "contravariance"
    - "contravariant"

- term: "WebAssembly (Wasm)"
  short_description: |-
    Um formato de instruções binárias que permite
    a execução de alto desempenho de código em navegadores web.
  long_description: |-
    **WebAssembly** (normalmente abreviado para **Wasm**) é um formato binário portável
    projetado como alvo de compilação para linguagens de programação, permitindo
    velocidades de execução próximas às nativas na web.

    O Dart permite compilar código diretamente para WebAssembly (usando a
    ferramenta `dart compile wasm`). Compilar Dart para Wasm pode ser especialmente
    vantajoso para apps Flutter web, melhorando a taxa de quadros, os tempos de inicialização
    e o tamanho da aplicação em comparação com a compilação padrão para JavaScript.
