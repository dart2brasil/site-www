- term: "Mixin application"
  short_description: |-
    Uma classe criada quando um mixin é aplicado a uma classe.
  long_description: |-
    Uma _mixin application_ (aplicação de mixin) é a classe criada quando
    um mixin é aplicado a uma classe.
    Por exemplo, considere as seguintes declarações:

    ```dart
    class A {}

    mixin M {}

    class B extends A with M {}
    ```

    A classe `B` é uma subclasse da aplicação do mixin `M` sobre `A`,
    às vezes chamada de `A+M`. A classe `A+M` é uma subclasse de `A` e
    tem membros copiados de `M`.

    Você pode dar um nome de fato a uma aplicação de mixin definindo-a assim:

    ```dart
    class A {}

    mixin M {}

    class A_M = A with M;
    ```

    Dada essa declaração de `A_M`, a declaração de `B` a seguir é
    equivalente à declaração de `B` do exemplo original:

    ```dart
    class B extends A_M {}
    ```
  related_links:
    - text: "Mixins em Dart"
      link: "/language/mixins"
      type: "doc"
  labels:
    - "language"
    - "understanding diagnostics"
  alternate:
    - "with mixin"

- term: "Null safety"
  short_description: |-
    Um recurso do sistema de tipos do Dart em que variáveis não podem
    conter `null`, a menos que o tipo explicitamente permita.
  long_description: |-
    Null safety (segurança contra null) no Dart é um recurso da linguagem que ajuda a
    prevenir erros causados por acesso não intencional a valores `null`.

    Com null safety, os tipos são non-nullable por padrão:
    uma variável não pode conter `null`, a menos que você
    declare o tipo dela como nullable com o sufixo `?`.

    ```dart
    int count = 42;   // Can't be null.
    int? maybeCount;  // Can be null (and is initialized to null by default).
    ```

    A null safety do Dart é [_sound_](#sound) (sólida).
    Se o sistema de tipos determina que uma variável tem um tipo non-nullable,
    essa variável é garantida para nunca ser `null` em tempo de execução.
    Essa garantia de solidez é imposta por meio de
    uma combinação de análise estática e verificações em tempo de execução,
    e permite otimizações do compilador
    que produzem código menor e mais eficiente.
  related_links:
    - text: "Sound null safety"
      link: "/null-safety"
      type: "doc"
    - text: "Entendendo null safety"
      link: "/null-safety/understanding-null-safety"
      type: "doc"
    - text: "Sound"
      link: "#sound"
      type: "term"
