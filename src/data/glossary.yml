    - "Main function"

- term: "Entrypoint directory"
  short_description: |-
    Um diretório que contém entrypoints Dart.
  long_description: |-
    Um _entrypoint directory_ (diretório de entrypoint) é um diretório dentro do seu [pacote][package] Dart que
    tem permissão para conter [entrypoints Dart][Dart entrypoints].

    O pub tem uma lista desses diretórios: `benchmark`, `bin`, `example`,
    `test`, `tool` e `web` (e `lib`, para [apps Flutter][Flutter apps]).
    Qualquer subdiretório deles (exceto `bin`) também pode conter entrypoints.

    [package]: #package
    [Dart entrypoints]: #entrypoint
    [Flutter apps]: https://docs.flutter.dev/packages-and-plugins/developing-packages
