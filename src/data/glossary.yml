- term: "Potentially constant"
  short_description: |-
    Uma expressão que pode ser avaliada em tempo de compilação
    se todos os parâmetros do construtor constante que a envolve
    forem substituídos por valores constantes,
    e todos os parâmetros de tipo forem substituídos por tipos concretos.
  long_description: |-
    Uma **potentially constant expression** (expressão potencialmente constante) é uma expressão
    que é válida em contextos onde uma constante é exigida,
    como as listas de inicialização de construtores constantes,
    mesmo que ela não seja uma constante de tempo de compilação por si só,
    porque referencia parâmetros do construtor ou parâmetros de tipo.

    Se todos os parâmetros do construtor constante que a envolve
    forem substituídos por valores constantes do tipo apropriado,
    e todos os parâmetros de tipo forem substituídos por tipos concretos,
    uma expressão potencialmente constante
    se torna uma expressão constante de tempo de compilação.

    Por exemplo, na seguinte classe:

    ```dart
    class ConstPoint {
      final int x;
      final int y;
      const ConstPoint(int a) : x = a, y = a + 1;
    }
    ```

    As expressões de inicialização `a` e `a + 1`
    são expressões potencialmente constantes.
    Elas não são expressões constantes
    porque o valor de `a` depende de como o construtor é chamado.

    No entanto, se o construtor for invocado com `const ConstPoint(3)`,
    o parâmetro `a` é substituído pela constante `3`,
    tornando `3` e `3 + 1` expressões constantes.
  related_links:
    - text: "Construtores constantes"
      link: "/language/constructors#constant-constructors"
      type: "doc"
    - text: "Construtores primários constantes"
      link: "/language/primary-constructors#constant-primary-constructors"
      type: "doc"
  labels:
    - "language"
    - "const"
  alternate:
    - "Potentially constant expression"

- term: "Potentially non-nullable"
  short_description: |-
    Um tipo que é non-nullable explicitamente ou
    por ser um parâmetro de tipo.
  long_description: |-
    Um tipo é _potentially non-nullable_ (potencialmente non-nullable) se for
    explicitamente non-nullable ou se for um parâmetro de tipo.

    Um tipo é explicitamente non-nullable se for um
    nome de tipo que não é seguido por um ponto de interrogação (`?`).
    Observe que há alguns tipos que são sempre nullable, como
    `Null` e `dynamic`, e que `FutureOr` só é non-nullable se
    não for seguido por um ponto de interrogação _e_
    o argumento de tipo for non-nullable (como em `FutureOr<String>`).

    Parâmetros de tipo são potencialmente non-nullable porque o tipo
    real em tempo de execução (o tipo especificado como argumento de tipo) pode ser non-nullable.
    Por exemplo, dada a declaração `class C<T> {}`,
    o tipo `C` pode ser usado com um argumento de tipo non-nullable, como em `C<int>`.
  related_links:
    - text: "Nullability e genéricos"
      link: "/null-safety/understanding-null-safety#nullability-and-generics"
      type: "doc"
  labels:
    - "language"
    - "type system"
    - "flow analysis"
    - "understanding diagnostics"
  alternate:
    - "potentially nullable"

- term: "Primary constructor"
  short_description: |-
    Uma sintaxe concisa para declarar um construtor principal diretamente no cabeçalho
    de uma classe, enum ou extension type.
  long_description: |-
    Um **primary constructor** (construtor primário) é um atalho de sintaxe que declara um construtor
    principal diretamente no cabeçalho de definição de uma classe, enum ou
    extension type.

    Construtores primários reduzem o código repetitivo de declarações de parâmetros e
    inicialização de campos, permitindo declarar parâmetros (`final` ou `var`)
    e formais de inicialização (`this.field`) diretamente no cabeçalho.

    Declarar um parâmetro com o modificador `var` ou `final`
    cria e inicializa implicitamente esse campo:

    ```dart
    class Point(var int x, var int y);
    ```
  related_links:
    - text: "Construtores primários"
      link: "/language/primary-constructors"
      type: "doc"
  labels:
    - "language"
    - "constructors"
    - "syntax"
  alternate:
    - "primary-constructor"

- term: "Private named parameter"
  short_description: |-
    Um parâmetro nomeado de construtor com nome privado na declaração
    e nome público nos pontos de chamada.
  long_description: |-
    Um **private named parameter** (parâmetro nomeado privado) é um parâmetro nomeado cujo nome
    é privado.

    Ele só é permitido quando o parâmetro é de inicialização (como `this._x`)
    ou de declaração (como `final T _x` ou `var T _x`). Parâmetros de inicialização
    ocorrem em construtores tradicionais ou primários, enquanto parâmetros de declaração
    só ocorrem em construtores primários.

    Um parâmetro de inicialização inicializa a variável de instância com o
    nome privado informado. Um parâmetro de declaração tanto declara
    quanto inicializa implicitamente uma variável de instância com o nome privado informado.

    Nos pontos de chamada, os argumentos são passados para parâmetros nomeados privados
    especificando o nome público correspondente (omitindo o underscore inicial):

    ```dart
    class Point {
      final double _x;
      final double _y;

      // Callers use the public names 'x' and 'y'.
      Point.named({required this._x, required this._y});
    }

    void main() {
      var p = Point.named(x: 10, y: 20); // Initializes '_x' and '_y'.
    }
    ```
  related_links:
    - text: "Parâmetros nomeados privados"
      link: "/language/constructors#private-named-parameters"
      type: "doc"
  labels:
    - "language"
    - "constructors"
  alternate:
    - "private-named-parameters"

- term: "Public library"
  short_description: |-
    Uma biblioteca localizada no diretório `lib` de um pacote, mas
    não dentro do diretório `lib/src`.
  long_description: |-
    Uma biblioteca pública é uma biblioteca localizada dentro do diretório `lib`
    do pacote, mas não dentro do diretório `lib/src`.
  related_links:
