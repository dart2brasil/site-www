- term: "Pub content hash"
  short_description: |-
    Hashes SHA256 mantidos pelo pub.dev para validar a integridade dos pacotes.
  long_description: |-
    O repositório pub.dev mantém um _content hash_ SHA256 de
    cada versão de cada pacote que hospeda.
    Os clientes do pub usam esse hash para validar a integridade dos pacotes baixados
    e se proteger contra alterações no repositório de origem.

    Quando o `dart pub get` baixa um pacote,
    ele calcula o hash do arquivo baixado.
    O hash de cada dependência hospedada é armazenado junto com a
    [resolução][resolution] no [lockfile][].

    O cliente do pub usa esse content hash para verificar se
    executar `dart pub get` novamente com o mesmo lockfile,
    possivelmente em outro computador, usa exatamente os mesmos pacotes.

    Se o hash travado não corresponder ao que está atualmente no pub cache,
    o pub baixa o arquivo novamente. Se ainda não corresponder,
    o lockfile é atualizado e um aviso é exibido.

    Para transformar uma divergência em erro em vez de aviso,
    use a opção [`--enforce-lockfile`][] do `dart pub get`.
    Com essa opção, se o pub não conseguir encontrar arquivos de pacote com os mesmos hashes,
    a resolução de dependências falha e o lockfile não é atualizado.

    [resolution]: /tools/pub/cmd/pub-get
    [lockfile]: #lockfile
    [`--enforce-lockfile`]: /tools/pub/cmd/pub-get#enforce-lockfile
  related_links:
    - text: "dart pub get --enforce-lockfile"
      link: "/tools/pub/cmd/pub-get#enforce-lockfile"
      type: "doc"
  labels:
    - "pub"
    - "security"

- term: "Pub system cache"
  short_description: |-
    Um diretório onde o pub armazena os pacotes remotos baixados.
  long_description: |-
    Quando o pub obtém um pacote remoto,
    ele o baixa para um único diretório de _pub system cache_ (cache do sistema do pub).
    No macOS e no Linux, esse diretório fica por padrão em `~/.pub-cache`.
    No Windows, o diretório fica por padrão em `%LOCALAPPDATA%\Pub\Cache`,
    embora o local exato possa variar conforme a versão do Windows.
    Você pode especificar outro local usando a variável de ambiente
    [`PUB_CACHE`][].

    Depois que os pacotes estão no cache do sistema,
    o pub cria um arquivo `package_config.json` que mapeia cada pacote
    usado pela sua aplicação para o pacote correspondente no cache.

    Você só precisa baixar uma determinada versão de um pacote uma vez
    e depois pode reutilizá-la em quantos pacotes quiser.
    Se você especificar a flag `--offline` para usar pacotes em cache,
    pode apagar e regenerar seus arquivos `package_config.json`
    sem precisar acessar a rede.

    [`PUB_CACHE`]: /tools/pub/environment-variables
  related_links:
    - text: "Variáveis de ambiente do pub"
      link: "/tools/pub/environment-variables"
      type: "doc"
  labels:
    - "pub"
    - "packages"
  alternate:
    - "Pub cache"

- term: "Pub workspace"
  short_description: |-
    Uma coleção de pacotes desenvolvidos em conjunto com
    uma resolução compartilhada das restrições de dependência.
  long_description: |-
    Um _pub workspace_ (workspace do pub) associa uma coleção de pacotes locais que são
    tratados como uma única unidade durante o desenvolvimento, permitindo
    a resolução compartilhada das restrições de dependência deles.
    Útil para desenvolver em um monorepo.

    Os pacotes compartilham os arquivos `pubspec.lock` e
    `.dart_tool/package_config.json` no diretório raiz do workspace.
  related_links:
