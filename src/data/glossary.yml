    Um _refutable pattern_ (padrão refutável) é um padrão que pode ser testado contra um valor para
    determinar se o padrão casa com o valor.
    Se não casar, o padrão _refuta_, ou nega, a correspondência.
    Padrões refutáveis aparecem em [_matching contexts_][matching contexts] (contextos de correspondência).

    [matching contexts]: /language/patterns#matching
