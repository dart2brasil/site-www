- term: "Obviously typed"
  short_description: |-
    Uma expressão cujo tipo pode ser determinado mecanicamente, sem ambiguidade.
  long_description: |-
    Uma expressão em Dart é considerada **obviously typed** (de tipo óbvio) quando
    o seu tipo fica imediatamente claro pela sintaxe,
    sem precisar de inferência ou análise complexa.

    Esse conceito é usado principalmente em regras de lint como
    `omit_obvious_local_variable_types` e `specify_nonobvious_property_types`
    para decidir se uma anotação de tipo explícita é redundante ou necessária.

    ### Expressões de tipo óbvio

    Os seguintes tipos de expressões são considerados de tipo óbvio:

    - Literais que não são de coleção:
      `1`, `true`, `'Hello'`.
    - Literais de coleção com argumentos de tipo explícitos:
      `<int>[]`, `<String, bool>{}`.
    - Literais de list/set homogêneos cujos elementos são de tipo óbvio:
      `[1, 2, 3]`, `{true, false}`.
    - Literais de map homogêneos com tipos de chave e valor óbvios:
      `{1: 10, 2: 20}`.
    - Literais de record com tipos óbvios:
      `(1, enabled: true)`.
    - Variáveis locais e parâmetros formais que não foram promovidos.
    - Criação de instância com classes não genéricas ou com argumentos de tipo explícitos:
      `C()`, `Set<int>()`.
    - Cascades com alvos de tipo óbvio:
      `StringBuffer('Hello, ')..write('world!')`.
    - Casts de tipo:
      `x as int`.
    - Expressões condicionais com ramos de tipo óbvio e do mesmo tipo:
      `condition ? 1 : 2`.
    - Testes de tipo:
      `x is String`.
    - Expressões throw:
      `throw Exception()`.
    - Expressões entre parênteses cujo conteúdo é de tipo óbvio:
      `('Hello!')`.
    - `this` e literais de tipo:
      `String`.

    Nesta lista, _homogêneo_ significa "onde todo elemento tem o mesmo tipo".
    Por exemplo, `{1: 'one', 2: 'two'}` é um map homogêneo,
    mas `{1: 'one', 1.5: true}` não é.
    Por outro lado, se o tipo de uma expressão exige inferência (por exemplo
    `[1, 2.5]` → `List<num>`), ela **não** é considerada de tipo óbvio.

    Essa distinção ajuda as regras de estilo a decidir quando
    exigir ou omitir anotações de tipo para clareza e consistência.
  related_links:
    - text: "Effective Dart: Style"
      link: "/effective-dart/style"
      type: "doc"
    - text: "Lint: omit_obvious_local_variable_types"
      link: "/tools/linter-rules/omit_obvious_local_variable_types"
