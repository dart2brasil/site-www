    - "Native code asset"

- term: "Constant context"
  short_description: |-
    Uma região do código em que a keyword const está implícita e
    tudo dentro dessa região precisa ser constante.
  long_description: |-
    Um _constant context_ (contexto constante) é uma região do código em que não é
    necessário incluir a keyword `const`, porque ela está implícita pelo
    fato de tudo naquela região ser obrigatoriamente constante.
    Os seguintes locais são contextos constantes:

    - Tudo dentro de um literal de lista, map ou set precedido pela
      keyword `const`. Por exemplo:

      ```dart
      var l = const [/*constant context*/];
      ```

    - Os argumentos dentro da invocação de um construtor constante.
      Por exemplo:

      ```dart
      var p = const Point(/*constant context*/);
      ```

    - O inicializador de uma variável precedida pela keyword `const`.
      Por exemplo:

      ```dart
      const v = /*constant context*/;
      ```

    - Annotations.

    - A expressão em uma cláusula `case`. Por exemplo:

      ```dart
      void f(int e) {
        switch (e) {
          case /*constant context*/:
            break;
        }
      }
      ```
  related_links:
    - text: "Variáveis final e const"
      link: "/language/variables#final-and-const"
      type: "doc"
    - text: "Não use const de forma redundante"
      link: "/effective-dart/usage#dont-use-const-redundantly"
      type: "doc"
  labels:
    - "language"
    - "const"
    - "understanding diagnostics"
  alternate:
