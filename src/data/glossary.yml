- term: "Entrypoint"
  short_description: |-
    Uma biblioteca Dart invocada diretamente por uma implementação Dart.
  long_description: |-
    No contexto geral do Dart, um _entrypoint_ (ponto de entrada) é
    uma biblioteca Dart invocada diretamente por uma implementação Dart.
    Por exemplo, quando você passa uma biblioteca Dart como argumento de linha de comando para
    a Dart VM standalone, essa biblioteca é o entrypoint.
    Em outras palavras, normalmente é o arquivo `.dart` que contém `main()`.

    No contexto do pub, um _entrypoint package_ ou _root package_ é
    a raiz de um grafo de dependências.
    Geralmente é uma aplicação.
    Quando você executa seu app, ele é o entrypoint package.
    Todos os outros pacotes dos quais ele depende não são entrypoints nesse contexto.

    Um pacote pode ser entrypoint em alguns contextos e não em outros.
    Digamos que seu app use um pacote `A`.
    Quando você executa seu app, `A` não é o entrypoint package.
    No entanto, se você for até `A` e executar os testes dele, nesse contexto,
    ele _é_ o entrypoint, já que seu app não está envolvido.
  related_links:
    - text: "Entrypoint directory"
      link: "#entrypoint-directory"
      type: "term"
  labels:
    - "pub"
    - "packages"
    - "language"
  alternate:
