- term: "Lockfile"
  short_description: |-
    Um arquivo chamado pubspec.lock que especifica as versões de cada dependência.
  long_description: |-
    Um arquivo chamado `pubspec.lock` que especifica as
    versões concretas e outras informações de identificação de cada
    [dependência imediata][immediate] e [transitiva][transitive] da qual um pacote depende.

    Diferente do [pubspec][], que lista apenas as dependências imediatas e
    permite intervalos de versão, o lockfile fixa de forma abrangente
    todo o grafo de dependências em versões específicas dos pacotes.
    Um lockfile garante que você consiga recriar a
    configuração exata dos pacotes usados por uma aplicação.

    O lockfile é gerado automaticamente pelo pub quando você executa
    [`pub get`][], [`pub upgrade`][] ou [`pub downgrade`][].
    O pub inclui um [content hash][] para cada dependência
    para verificar nas próximas resoluções.

    Se o seu pacote for um [application package][], normalmente você
    o incluirá no controle de versão. Para pacotes regulares (de biblioteca), geralmente não.

