- term: "Interop"
  short_description: |-
    A capacidade de código Dart interagir com código escrito em outras linguagens.
  long_description: |-
    **Interop** (abreviação de _interoperability_, interoperabilidade) refere-se à capacidade do Dart de
    se comunicar e trabalhar com código escrito em outras linguagens de programação.

    No Dart, interop é comumente usado para:

    - Chamar código nativo escrito em linguagens como C, C++ ou Rust.
    - Interagir com APIs específicas de plataforma.
    - Reutilizar bibliotecas existentes que não são escritas em Dart.

    O Dart oferece diferentes mecanismos de interop
    dependendo da plataforma e do caso de uso.
    Por exemplo, aplicações Dart podem usar a
    Foreign Function Interface (FFI) para chamar bibliotecas nativas, ou
    camadas de interop específicas de plataforma ao rodar no Flutter ou na web.
  related_links:
