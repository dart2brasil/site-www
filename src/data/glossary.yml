- term: "Late"
  id: "late"
  short_description: |-
    Uma keyword que habilita a inicialização adiada de variáveis e é
    tipicamente usada com variáveis non-nullable.
  long_description: |-
    A keyword `late` no Dart é usada para indicar que uma variável
    será inicializada depois, após sua declaração, mas antes de ser usada.
    Isso evita a necessidade de tornar uma variável nullable (`?`) quando você
    sabe que ela vai receber um valor com certeza, só que não imediatamente.

    Usar `late` adia a inicialização, permitindo escrever código mais
    flexível e legível, especialmente ao lidar com dependências
    ou configurações complexas.

    Por exemplo:
    ```dart
    late String description;

    void setup() {
      description = 'This will be initialized before use.';
    }
    ```

    Tenha cuidado com variáveis late que fazem parte de uma API pública.
    Se um cliente acessar a variável antes de ela ser inicializada,
    ele vai encontrar um `LateInitializationError`, que oferece
    pouco contexto. Nesses casos, considere usar uma
    variável nullable privada com um getter público que lança um
    erro descritivo (por exemplo, `StateError`) se for acessada cedo demais,
    já que isso pode dar um feedback mais claro aos usuários da API, apesar da
    complexidade extra.

    Você também pode usar `late final` quando a variável deve ser definida apenas uma vez.
    Isso é útil em cenários em que o valor não está disponível no momento da
    construção do objeto, como em dependências cíclicas em grafos de objetos.

    Exemplo:

    ```dart
    class LinkedQueue<T> {
      late final QueueLink<T> _head;

      LinkedQueue() {
        _head = QueueLink<T>._head(owner: this); // Cyclic reference between objects
      }
    }
    ```

    Cuidado: se uma variável late for acessada antes de ser inicializada
    ou nunca for inicializada, isso causará um erro em tempo de execução.

  related_links:
